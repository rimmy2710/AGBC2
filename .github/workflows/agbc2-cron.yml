name: AGBC2 Cron

"on":
  workflow_dispatch:
    inputs:
      openai_enabled:
        description: "Enable OpenAI (1 to enable, 0 to disable). Only affects workflow_dispatch runs."
        required: false
        default: "0"
      max_ai_items:
        description: "Max items to send to AI per run (safe default 1). Only affects workflow_dispatch runs."
        required: false
        default: "1"
  schedule:
    - cron: "0 * * * *"  # every hour

concurrency:
  group: agbc2-cron
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Always write state/logs under the workspace (never /home/codespace)
      AGBC2_HOME: ${{ github.workspace }}/.agbc2
      AGBC2_LOG_DIR: ${{ github.workspace }}/.agbc2/logs
      AGBC2_SECRETS_DIR: ${{ github.workspace }}/.agbc2/secrets
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/.agbc2/secrets/gspread_service_account.json

      # Telegram (StringSession - recommended)
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}

      # Google Sheets
      GSPREAD_SA_JSON_B64: ${{ secrets.GSPREAD_SA_JSON_B64 }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      ADMIN_CONFIG_SHEET_ID: ${{ secrets.ADMIN_CONFIG_SHEET_ID }}

      # OpenAI:
      # - Scheduled cron runs: ALWAYS OFF by default (stable pipeline, no quota noise)
      # - workflow_dispatch runs: controllable via inputs
      OPENAI_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.openai_enabled || '0' }}
      MAX_AI_ITEMS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_ai_items || '0' }}

      # OpenAI credentials/model can stay as secrets; they won't be used when OPENAI_ENABLED=0
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}

      # Optional toggles
      SELF_LEARNING_ENABLED: "0"

      # (Optional but recommended if your code supports them)
      OPENAI_TIMEOUT: "15"
      OPENAI_MAX_RETRIES: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install secrets (from env to files)
        run: |
          set -e
          mkdir -p "$AGBC2_LOG_DIR" "$AGBC2_SECRETS_DIR"
          bash scripts/install_secrets_from_env.sh
          ls -la "$AGBC2_SECRETS_DIR"
          test -s "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Sanity env (no secrets)
        run: |
          echo "HOME=$HOME"
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "AGBC2_HOME=$AGBC2_HOME"
          echo "AGBC2_LOG_DIR=$AGBC2_LOG_DIR"
          echo "AGBC2_SECRETS_DIR=$AGBC2_SECRETS_DIR"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$GOOGLE_APPLICATION_CREDENTIALS"
          python - <<'PY'
          import os
          keys=[
            "TELEGRAM_API_ID","TELEGRAM_API_HASH","TELEGRAM_STRING_SESSION",
            "GOOGLE_SHEET_ID","ADMIN_CONFIG_SHEET_ID","GOOGLE_APPLICATION_CREDENTIALS",
            "OPENAI_ENABLED","OPENAI_MODEL","MAX_AI_ITEMS"
          ]
          for k in keys:
              print(f"{k}={'OK' if os.getenv(k) else 'MISSING'}")
          PY

      - name: Run AGBC2
        run: |
          set -e
          ./scripts/run_all.sh
        shell: bash

      - name: Dump logs on failure
        if: failure()
        run: |
          echo "[CI] Dumping logs (if any): $AGBC2_LOG_DIR"
          ls -la "$AGBC2_LOG_DIR" || true
          tail -n 400 "$AGBC2_LOG_DIR"/*.log 2>/dev/null || true

      - name: Upload logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agbc2-logs
          path: ${{ github.workspace }}/.agbc2/logs
